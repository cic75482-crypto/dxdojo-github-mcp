<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水曜のDX道場 — GitHub MCP ハンズオン</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #fff8e7;
      color: #333333;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ffe4a8;
      box-shadow: 0 8px 24px rgba(255, 183, 77, 0.18);
    }

    .label {
      color: #f39c12;
    }

    h1 {
      color: #222222;
    }

    .lead {
      color: #555555;
    }

    .edit-me {
      background: #fff4cc;
      border: 1px solid #ffd66b;
    }

    .edit-me h2 {
      color: #e67e22;
    }

    #message {
      color: #444444;
    }

    footer {
      color: #666666;
    }

    .badge {
      background: #ffd166;
      color: #5a3d00;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">水曜のDX道場</p>
    <h1>GitHub MCP ハンズオン</h1>
    <p class="lead">
      このページは <strong>GitHub Actions</strong> によって自動デプロイされています。<br>
      <code>main</code> ブランチに push されると、数十秒後にこのページが更新されます。
    </p>

    <!-- ▼▼▼ ハンズオンではここを編集します ▼▼▼ -->
    <section class="edit-me">
      <h2>参加者メッセージ</h2>
      <p id="message">Hello Github MCP〜 practice-ctで練習中！</p>
    </section>
    <!-- ▲▲▲ ハンズオンではここを編集します ▲▲▲ -->

    <footer>
      <p>デプロイ回数: <span class="badge">v1</span></p>
    </footer>
  </main>
</body>
</html>
